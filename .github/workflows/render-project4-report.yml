name: Render Project 4 LaTeX report

on:
  push:
    branches: [main]
    paths:
      - 'docs/informe/**'
      - 'tools/generar_informe_latex.py'
      - 'proyecto4/alternativas/tendencia_lenta/resultados/**'
      - '.github/workflows/render-project4-report.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-lang-spanish lmodern poppler-utils
      - name: Generate evidence tables and compile real LaTeX
        run: |
          python -B tools/generar_informe_latex.py
          bash docs/informe/compilar.sh
          python -B tools/auditar_pdf.py
      - name: Upload compiled PDF and compilation logs
        uses: actions/upload-artifact@v4
        with:
          name: project4-latex-report
          path: |
            docs/INFORME_FINAL.pdf
            docs/AUDITORIA_ENTREGA.pdf
            docs/AUDITORIA_ENTREGA.json
            docs/informe/build/*.log
            docs/informe/build/pdfinfo.txt
