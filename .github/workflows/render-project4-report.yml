name: Render Project 4 technical report

on:
  push:
    branches:
      - main
    paths:
      - "proyecto4/documentacion/informe_final_proyecto4.md"
      - "proyecto4/documentacion/generar_pdf.py"
      - ".github/workflows/render-project4-report.yml"

permissions:
  contents: write

jobs:
  render-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ReportLab
        run: python -m pip install reportlab==5.0.1

      - name: Generate PDF
        run: python proyecto4/documentacion/generar_pdf.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proyecto4/entrega_final/informe_final_proyecto4.pdf
          if git diff --cached --quiet; then
            echo "PDF sin cambios"
            exit 0
          fi
          git commit -m "Regenera PDF técnico de Proyecto 4"
          git push origin HEAD:main
