name: Replay all 78 stock scenarios
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys verilator g++ make
      - name: Audit published traces and firmware
        run: python -B tools/auditar_campania_acciones.py
      - name: Replay all inputs through active SPI and CPU
        run: python -B tools/repetir_acciones_archivadas.py --jobs 2
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-78-stock-scenarios
          path: build/repeticion_acciones_archivadas/
