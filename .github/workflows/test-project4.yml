name: Project 4 regression

on:
  push:
    branches: [main]
    paths:
      - 'rtl/**'
      - 'sw/**'
      - 'tools/**'
      - 'tb/**'
      - 'proyecto4/**'
      - 'competition.bin'
      - '.gitattributes'
      - '.github/workflows/test-project4.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys verilator g++ make
      - name: Check active image and source hashes
        run: python -B tools/trader.py verify
      - name: Accounting and causality invariants
        run: python -B proyecto4/alternativas/competitiva_definitiva/test_invariantes.py
      - name: Reassemble and compare Python with RV32E on 160000 ticks
        run: python -B proyecto4/alternativas/competitiva_definitiva/validar_equivalencia.py
      - name: Audit complete stored RTL evidence and Git history
        run: python -B proyecto4/alternativas/competitiva_definitiva/auditar_entrega.py
      - name: Simulate active RTL over SPI
        run: python -B tools/trader.py test
      - name: Compare active RTL on all eight series
        run: python -B tools/validar_activo_verilator.py
      - name: Upload current test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project4-validation
          path: |
            build/trader/*.log
            build/trader/verilator/*.log
            build/trader/equivalencia_verilator.json
            build/trader/rtl_*/decisiones.csv
            proyecto4/alternativas/competitiva_definitiva/resultados/equivalencia_rv32e.json
            proyecto4/alternativas/competitiva_definitiva/resultados/auditoria_entrega.json
