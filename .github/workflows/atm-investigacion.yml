name: ATM reproducible research
on:
  push:
    branches: [codex/atm-adaptativa]
  pull_request:
    paths:
      - 'proyecto4/alternativas/atm_adaptativa/**'
      - '.github/workflows/atm-investigacion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Reproduce research and verify preserved firmware
        run: python -X utf8 -B proyecto4/alternativas/atm_adaptativa/ejecutar_todo.py --sin-rtl-referencia --sin-pdf
      - name: Keep the financial rejection explicit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('proyecto4/alternativas/atm_adaptativa')
          assert json.loads((p/'resultados/decision.json').read_text())['estado']=='NO-GO'
          assert not (p/'trade.hex').exists() and not (p/'build/competition.bin').exists()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atm-no-go-evidence
          path: |
            proyecto4/alternativas/atm_adaptativa/resultados/*.csv
            proyecto4/alternativas/atm_adaptativa/resultados/*.json
            proyecto4/alternativas/atm_adaptativa/resultados/*.log
            proyecto4/alternativas/atm_adaptativa/SHA256_entrega.txt
